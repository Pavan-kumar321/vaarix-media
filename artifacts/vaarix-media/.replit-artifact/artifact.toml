kind = "web"
previewPath = "/"
title = "Vaarix Media"
version = "1.0.0"
id = "artifacts/vaarix-media"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25541

[services.development]
run = "pnpm --filter @workspace/vaarix-media run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vaarix-media", "run", "build" ]
serve = "static"
publicDir = "artifacts/vaarix-media/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25541"
BASE_PATH = "/"
